<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front Page</title>
    <style>
        /* General styles */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #333;
        }

        /* Header & Footer */
        header, footer {
            background-color: #4C567C;
            color: white;
            text-align: center;
            padding: 1.5rem 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        footer p {
            font-size: 0.9rem;
            margin: 0;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: center;
            background-color: #4C567C;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 0.5rem 0;
        }

        nav a {
            margin: 0 15px;
            text-decoration: none;
            font-size: 1rem;
            color: white;
            font-weight: bold;
            padding: 0.5rem 1rem;
            transition: background-color 0.3s, color 0.3s;
        }

        nav a:hover {
            background-color: #FF6F61;
            color: white;
            border-radius: 5px;
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 30px;
            text-align: center;
        }

        main h2 {
            font-size: 2rem;
            color: #4C567C;
        }

        main p {
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Crime, Media, and Morality</h1>
    </header>
    <nav>
        <a href="selena.html">Selena</a>
        <a href="luigi.html">Mangione</a>
        <a href="media.html">Media's Impact</a>
    </nav>
    <main>
        <h2>Introduction</h2>
        <p>
            Welcome to the front page, where we explore the fascinating intersections of crime, media, and societal morality.
            Dive into the stories and their profound impacts.
        </p>
    </main>
    <footer>
        <p>&copy; 2025 Senior Project</p>
    </footer>
</body>
</html>
